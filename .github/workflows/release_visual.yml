# Reusable: packages the calling visual as a development build and publishes it to its "latest" release
name: Build release

on:
  workflow_call:

permissions:
  contents: write

env:
  # npm 12+ disables installing packages from git refs by default
  NPM_CONFIG_ALLOW_GIT: root

jobs:
  build-pbiviz-packages:
    name: "Pre Release"
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node 26
      uses: actions/setup-node@v7
      with:
        node-version: 26.x

    - name: Build
      run: |
        npm ci
        npm install -g powerbi-visuals-tools@7.2.1
        npm run package:dev

    - name: "Create Release"
      uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "latest"
        prerelease: false
        title: "Development Build"
        files: dist/*.pbiviz
